# E2E tests — fully self-contained, no external secrets required.
# Services: PostgreSQL (database) + Maildev (email capture)
# Data: Prisma seed populates orgs, memberships, and subscriptions.
# Auth: E2E user created via Better Auth API in auth.setup.ts.
#
# Opt-in: this run is gated behind the "e2e" PR label to save CI minutes.
# Add the "e2e" label to a PR to trigger it; while labeled, it re-runs on
# every new commit. Remove the label to stop future runs.
name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, develop]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2euser
          POSTGRES_PASSWORD: e2epass
          POSTGRES_DB: e2edb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U e2euser -d e2edb"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://e2euser:e2epass@localhost:5432/e2edb
      BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-chars-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: SaaSProKit
      CI: true
      EMAIL_FROM: noreply@test.com
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILDEV_URL: http://localhost:1080
      STRIPE_SECRET_KEY: sk_test_stub
      STRIPE_WEBHOOK_SECRET: whsec_stub
      STORAGE_PROVIDER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start Maildev
        run: |
          docker run -d --name maildev -p 1025:1025 -p 1080:1080 maildev/maildev:3.0.0-rc.1
          # Probe the REST endpoint the tests use, not "/": every Maildev
          # version serves the web UI at "/", so a version whose API lives
          # elsewhere still looks ready and fails three minutes later instead.
          for i in $(seq 1 15); do
            if curl -sf http://localhost:1080/api/email > /dev/null 2>&1; then
              echo "Maildev is ready"
              exit 0
            fi
            echo "Waiting for Maildev... ($i/15)"
            sleep 2
          done
          echo "Maildev never answered on /api/email"
          docker logs maildev || true
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter @repo/database exec prisma generate

      - name: Push database schema
        run: pnpm --filter @repo/database exec prisma db push

      - name: Seed database
        run: pnpm --filter @repo/database exec prisma db seed

      - name: Build app
        run: pnpm --filter web build

      - name: Run E2E tests
        run: pnpm --filter web test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
