version: 2
updates:
  # GitHub Actions — keep CI actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # npm — root + all monorepo apps and packages
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Safe updates — bundle minor and patch into one PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "prisma"
          - "@prisma/*"
          - "next"
          - "better-auth"
          - "stripe"
      # Dev tooling — low risk, bundle together
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
