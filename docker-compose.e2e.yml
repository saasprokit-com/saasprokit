# =============================================================================
# Docker Compose — E2E Testing
#
# Provides an isolated database and email catcher for E2E tests.
# Uses port 5433 to avoid conflicting with the dev postgres on 5432.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d    # Start services
#   docker compose -f docker-compose.e2e.yml down      # Stop services
#   docker compose -f docker-compose.e2e.yml down -v   # Stop + remove volumes
# =============================================================================

services:
  e2e-postgres:
    image: postgres:16-alpine
    container_name: e2e-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: e2euser
      POSTGRES_PASSWORD: e2epass
      POSTGRES_DB: e2edb
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2euser -d e2edb"]
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev:3.0.0-rc.1
    container_name: e2e-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    healthcheck:
      # 127.0.0.1, not localhost: the web UI binds IPv4-only, and localhost
      # resolves to ::1 inside the container, failing the check.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1080"]
      interval: 10s
      timeout: 5s
      retries: 5
